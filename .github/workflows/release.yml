name: Release

# Push a tag like v0.1.0 to publish lecouz-product-designer.zip as a GitHub release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the plugin version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qE "^ \* Version:\s+${version}\s*$" lecouz-product-designer.php \
            || { echo "Tag ${GITHUB_REF_NAME} does not match the Version header of lecouz-product-designer.php"; exit 1; }
          grep -qE "^Stable tag: ${version}\s*$" readme.txt \
            || { echo "Tag ${GITHUB_REF_NAME} does not match Stable tag in readme.txt"; exit 1; }

      - name: Build the zip
        run: git archive --format=zip --prefix=lecouz-product-designer/ -o lecouz-product-designer.zip HEAD

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" lecouz-product-designer.zip --title "$GITHUB_REF_NAME" --generate-notes
